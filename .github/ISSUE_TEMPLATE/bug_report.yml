name: Bug report
description: Something broken — crash, wrong prices, hotkeys dead, panel weirdness
labels: [bug]
body:
  - type: dropdown
    id: install
    attributes:
      label: Install method
      options:
        - AppImage CPU
        - AppImage NVIDIA
        - AUR CPU (waystone)
        - AUR NVIDIA (waystone-cuda)
        - Built from source / dev checkout

  - type: dropdown
    id: version
    attributes:
      label: Kwaystone version
      description: "Release version/AppImage filename, or `pacman -Qi waystone | grep Version` for AUR installs. List is maintained by the release workflow."
      options:
        # versions-start
        - 0.1.1
        - 0.1.0
        # versions-end
        - older or dev build

  - type: input
    id: system
    attributes:
      label: Compositor and system
      description: "KDE Plasma or Hyprland version plus distro. Example: `plasmashell --version` or `hyprctl version | head -1`."
      placeholder: "KDE Plasma 6.5, Arch"

  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected, what you got instead.

  - type: textarea
    id: log
    attributes:
      label: Log output
      description: |
        Paste the relevant tail of `~/.local/state/waystone/waystone.log` (brain stack traces land there too).
        Reproduce with debug logging if you can: run `WAYSTONE_DEBUG=1 waystone`.
        The log never contains your session cookie, but skim before posting anyway.
      render: text

  - type: textarea
    id: item
    attributes:
      label: Item text (for parse/price bugs)
      description: Hover the item in game, press Ctrl+C, paste here. Skip if not item-related.
      render: text
