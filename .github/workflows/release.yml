name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  tests:
    uses: ./.github/workflows/test.yml

  release:
    needs: tests
    runs-on: ubuntu-latest
    # 'aur' environment carries the AUR secrets behind a required-reviewer
    # gate: each release waits for a manual approve before publishing.
    environment: aur
    steps:
      - uses: actions/checkout@v5

      - name: version from tag
        id: ver
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: source tarball
        run: |
          git archive --format=tar.gz \
            --prefix="waystone-${{ steps.ver.outputs.version }}/" \
            -o "waystone-${{ steps.ver.outputs.version }}.tar.gz" \
            "$GITHUB_REF_NAME"

      - name: github release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "waystone-${{ steps.ver.outputs.version }}.tar.gz" \
            --generate-notes

      - name: render AUR PKGBUILD
        run: |
          SHA=$(sha256sum "waystone-${{ steps.ver.outputs.version }}.tar.gz" | cut -d' ' -f1)
          sed -e "s/@VERSION@/${{ steps.ver.outputs.version }}/" \
              -e "s/@SHA256@/${SHA}/" \
              packaging/PKGBUILD.release > PKGBUILD.aur

      - name: publish to AUR
        uses: KSXGitHub/github-actions-deploy-aur@v4.1.3
        with:
          pkgname: waystone
          pkgbuild: PKGBUILD.aur
          commit_username: ${{ secrets.AUR_USERNAME }}
          commit_email: ${{ secrets.AUR_EMAIL }}
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "release ${{ github.ref_name }}"
